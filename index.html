
<!DOCTYPE html>

<head>

    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My To-Do List</h1>

    <div class="container">
        

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >
            <button id="addBtn">Add Task</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="todolist.js"></script>
</body>
</html>
